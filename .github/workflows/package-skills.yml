name: Package Standalone Skills

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'skills/**'
      - 'scripts/package-skill.sh'
      - 'scripts/generate-simulator-question-author-snapshot.ts'
      - 'scripts/generate-system-design-concept-registry.mjs'
      - 'scripts/sync-classroom-question-author.mjs'
      - 'scripts/validate-simulator-question-author.ts'
      - 'src/engine/analysis/authoringCapabilities.ts'
      - 'src/engine/analysis/builderPolicy.ts'
      - 'src/engine/catalog/paletteTemplates.ts'
      - 'docs/system-design-concept-taxonomy.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/package-skills.yml'

permissions:
  contents: read

jobs:
  package-skill:
    name: Package ${{ matrix.skill }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        skill:
          - simulator-question-author
          - classroom-question-author

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package standalone skill
        run: bash scripts/package-skill.sh ${{ matrix.skill }}

      - name: Upload ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.skill }}
          path: |
            dist/skills/${{ matrix.skill }}.zip
            dist/skills/${{ matrix.skill }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
